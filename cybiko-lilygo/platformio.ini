; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = T-Deck-Cybiko
src_dir = cybiko-emu
boards_dir = boards

; Cybiko Xtreme (default). Card folder /cybiko.
[env:T-Deck-Cybiko]
platform = espressif32@6.3.0
board = T-Deck
framework = arduino
upload_speed = 921600
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
build_unflags = -Os
extra_scripts = pre:tools/version.py
machine_flags =
    -DEMU_TIMER_STRIDE=20
build_flags =
    -O2
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DDISABLE_ALL_LIBRARY_WARNINGS
    ${this.machine_flags}
    -I../cybiko-c-emulator/src/radio
    ; radio: 915 MHz (US), 500 kHz, 14 dBm (radio_transport.h)
    -DCYBIKO_RADIO_TX=1

    ; TFT_eSPI configuration via build flags (overrides User_Setup.h)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=41
    -DTFT_MISO=38
    -DTFT_SCLK=40
    -DTFT_CS=12
    -DTFT_DC=11
    -DTFT_RST=-1
    -DTFT_BL=42
    -DTFT_BACKLIGHT_ON=1
    -DSPI_FREQUENCY=80000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    SD
    SPI
    Wire

; Cybiko Classic (V1). Card folder /cybiko-v1 (boot.bin = cyrom112.bin,
; flash.bin = flash_v1246.bin); saves the flash chip to save.flash.
; Stride 12: ~15.4k guest instructions a frame, inside what the T-Deck runs
; at 60 fps, so audio never runs dry; at 8 it fell to ~50 fps under load.
; 12 booted in 12 of 12 timing variants on the host; 11, 16 and 20 stop on
; the boot logo (PLAN-V1.md).
[env:T-Deck-Cybiko-V1]
extends = env:T-Deck-Cybiko
machine_flags =
    -DCYBIKO_MACHINE_V1
    -DEMU_TIMER_STRIDE=12
