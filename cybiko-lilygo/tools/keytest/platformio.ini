; T-Deck keyboard and trackball test, no emulator.
; pio run -t upload, then read /dev/ttyACM0 at 115200.
; Reflash the emulator afterwards from ../.. (pio run -t upload).

[platformio]
boards_dir = ../../boards

[env:keytest]
platform = espressif32@6.3.0
board = T-Deck
framework = arduino
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -I../../cybiko-emu
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=41
    -DTFT_MISO=38
    -DTFT_SCLK=40
    -DTFT_CS=12
    -DTFT_DC=11
    -DTFT_RST=-1
    -DTFT_BL=42
    -DTFT_BACKLIGHT_ON=1
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    SPI
    Wire

; Raw mode: prints each column/row bit as it goes down and up.
[env:keytest-raw]
extends = env:keytest
build_flags =
    ${env:keytest.build_flags}
    -DKEYTEST_RAW
