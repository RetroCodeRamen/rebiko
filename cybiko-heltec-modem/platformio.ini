; Heltec WiFi LoRa 32 V3 as a USB LoRa modem for the PC emulator.
; See README.md. Upload: pio run -t upload

[env:heltec-modem]
platform = espressif32@6.3.0
board = heltec_wifi_lora_32_V3
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 921600
build_flags =
    -I../cybiko-c-emulator/src/radio
    ; transmit power is CYBIKO_LORA_POWER_DBM in radio_transport.h (22)
lib_deps =
    olikraus/U8g2@^2.35.30
